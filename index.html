
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPER FOOTBALL</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101820;color:white;
 font-family:Arial;text-align:center;
}
h1{color:#ffe600;text-shadow:0 0 12px orange}
#score{
 font-size:27px;font-weight:bold;margin:10px;
}
#field{
 width:min(900px,96vw);
 height:min(570px,65vh);
 min-height:400px;
 margin:auto;position:relative;
 overflow:hidden;
 background:#168d43;
 border:5px solid white;
}
.stripe{
 position:absolute;top:0;bottom:0;width:12.5%;
 background:#ffffff0b;
}
#middle{
 position:absolute;left:50%;height:100%;
 border-left:3px solid white;
}
#circle{
 position:absolute;left:50%;top:50%;
 width:120px;height:120px;
 border:3px solid white;border-radius:50%;
 transform:translate(-50%,-50%);
}
.goal{
 position:absolute;top:38%;height:24%;
 width:35px;border:4px solid white;
}
#goalL{left:0;border-left:0}
#goalR{right:0;border-right:0}
.player,.enemy,.keeper{
 position:absolute;width:35px;height:35px;
 border-radius:50%;display:flex;
 align-items:center;justify-content:center;
 font-size:18px;z-index:3;
}
.player{background:#087bff;border:3px solid white}
.enemy{background:#ed2727;border:3px solid white}
.keeper{background:#ffdf00;border:3px solid white}
#ball{
 position:absolute;width:20px;height:20px;
 background:white;border-radius:50%;
 border:2px solid black;z-index:4;
}
#controls{
 margin:15px auto;display:flex;
 justify-content:center;gap:15px;
}
button{
 background:#ffdf00;border:0;padding:13px 20px;
 border-radius:9px;font-weight:bold;font-size:17px;
 cursor:pointer;
}
#directions{
 display:grid;grid-template-columns:repeat(3,55px);
 gap:5px;justify-content:center;
}
#directions button{padding:13px 5px}
#message{margin:10px;color:#ddd}
</style>
</head>
<body>

<h1>⚽ SUPER FOOTBALL</h1>
<div id="score">AZUL 0 × 0 VERMELHO</div>

<div id="field">
 <div class="stripe" style="left:0"></div>
 <div class="stripe" style="left:25%"></div>
 <div class="stripe" style="left:50%"></div>
 <div class="stripe" style="left:75%"></div>
 <div id="middle"></div>
 <div id="circle"></div>
 <div class="goal" id="goalL"></div>
 <div class="goal" id="goalR"></div>
 <div id="ball"></div>
</div>

<div id="controls">
 <div id="directions">
  <span></span><button onclick="move(0,-1)">⬆️</button><span></span>
  <button onclick="move(-1,0)">⬅️</button>
  <button onclick="move(0,1)">⬇️</button>
  <button onclick="move(1,0)">➡️</button>
 </div>
 <div>
  <button onclick="kick()">⚽ CHUTAR</button>
  <button onclick="pass()">PASSE</button>
 </div>
</div>

<div id="message">Use WASD ou as setas para jogar. Espaço para chutar.</div>
<button onclick="restart()">NOVO JOGO</button>

<script>
const field=document.getElementById("field");
const ball=document.getElementById("ball");
const W=900,H=570;

let azul=0,vermelho=0;
let px=180,py=285;
let bx=450,by=285;
let vx=0,vy=0;
let direction=1;
let time=90;
let running=true;

const player=document.createElement("div");
player.className="player";
player.textContent="10";
field.appendChild(player);

let enemies=[];
for(let i=0;i<4;i++){
 let e=document.createElement("div");
 e.className="enemy";
 e.textContent=""+(i+7);
 field.appendChild(e);
 enemies.push({
  el:e,x:550+i*55,y:120+i*100
 });
}

const keeper=document.createElement("div");
keeper.className="keeper";
keeper.textContent="GK";
field.appendChild(keeper);

function render(){
 player.style.left=px-17+"px";
 player.style.top=py-17+"px";
 ball.style.left=bx-10+"px";
 ball.style.top=by-10+"px";
 keeper.style.left="850px";
 keeper.style.top=285-17+"px";
 enemies.forEach(e=>{
  e.el.style.left=e.x-17+"px";
  e.el.style.top=e.y-17+"px";
 });
}

function move(dx,dy){
 if(!running)return;
 px=Math.max(30,Math.min(870,px+dx*22));
 py=Math.max(30,Math.min(540,py+dy*22));
 direction=dx||direction;
 render();
}

function kick(){
 if(!running)return;
 let dx=bx-px,dy=by-py;
 let d=Math.hypot(dx,dy);
 if(d<75){
  vx=direction*13;
  vy=dy*.12;
 }
}

function pass(){
 if(!running)return;
 let dx=bx-px,dy=by-py;
 if(Math.hypot(dx,dy)<85){
  vx=direction*8;
  vy=dy*.15;
 }
}

document.addEventListener("keydown",e=>{
 if(["ArrowUp","w"].includes(e.key))move(0,-1);
 if(["ArrowDown","s"].includes(e.key))move(0,1);
 if(["ArrowLeft","a"].includes(e.key))move(-1,0);
 if(["ArrowRight","d"].includes(e.key))move(1,0);
 if(e.code==="Space")kick();
});

function update(){
 if(!running)return;

 bx+=vx;by+=vy;
 vx*=.985;vy*=.985;

 enemies.forEach(e=>{
  let dx=bx-e.x,dy=by-e.y;
  let d=Math.hypot(dx,dy);
  if(d>1){
   e.x+=dx/d*1.5;
   e.y+=dy/d*1.5;
  }
  if(d<24){
   vx=-3;vy=(by-e.y)*.3;
  }
 });

 if(bx<30||bx>870){
  if(by>210&&by<360){
   if(bx>870)azul++;
   else vermelho++;
   resetBall();
  }else{
   vx=-vx;
  }
 }

 if(by<15||by>555)vy=-vy;

 if(Math.hypot(bx-px,by-py)<29){
  if(Math.abs(vx)+Math.abs(vy)<2){
   bx+=direction*3;
  }
 }

 if(bx>825&&by>230&&by<340){
  vx=-Math.abs(vx)-3;
 }

 render();
 document.getElementById("score").textContent=
 "AZUL "+azul+" × "+vermelho+" VERMELHO";
}

function resetBall(){
 bx=450;by=285;vx=0;vy=0;
 px=180;py=285;
 enemies.forEach((e,i)=>{
  e.x=550+i*55;e.y=120+i*100;
 });
}

function restart(){
 azul=0;vermelho=0;time=90;
 running=true;resetBall();render();
}

setInterval(update,16);

setInterval(()=>{
 if(!running)return;
 time--;
 document.getElementById("message").textContent=
 "Tempo restante: "+time+" segundos";
 if(time<=0){
  running=false;
  document.getElementById("message").textContent=
   azul>vermelho?"🏆 AZUL VENCEU!":
   vermelho>azul?"🏆 VERMELHO VENCEU!":"🤝 EMPATE!";
 }
},1000);

render();
</script>
</body>
</html>
