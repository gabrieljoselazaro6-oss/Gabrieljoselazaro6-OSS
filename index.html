<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Cidade Sombria</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #050509;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    background:
    radial-gradient(circle at center, #20202c, #050509 75%);
    position: relative;
    overflow: hidden;
}

#menu {
    position: absolute;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: linear-gradient(#090912dd,#000);
    z-index: 10;
    text-align: center;
}

h1 {
    color: #ff2525;
    font-size: 55px;
    text-shadow: 0 0 20px red;
    margin-bottom: 20px;
}

button {
    padding: 15px 35px;
    background: #a00000;
    color: white;
    border: 2px solid red;
    font-size: 20px;
    cursor: pointer;
    margin-top: 25px;
    border-radius: 8px;
}

button:hover {
    background: red;
}

#player {
    position: absolute;
    font-size: 40px;
    left: 50%;
    bottom: 100px;
    transform: translateX(-50%);
}

.monster {
    position: absolute;
    font-size: 45px;
    top: 0;
}

#hud {
    position: absolute;
    top: 15px;
    left: 15px;
    font-size: 20px;
    z-index: 5;
}

#message {
    position: absolute;
    bottom: 25px;
    width: 100%;
    text-align: center;
    color: #aaa;
}

#gameover {
    display: none;
    position: absolute;
    inset: 0;
    background: #000e;
    z-index: 8;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#gameover h2 {
    color: red;
    font-size: 50px;
}

#flash {
    position: absolute;
    inset: 0;
    background: red;
    opacity: 0;
    pointer-events: none;
    z-index: 6;
}

#controls {
    position: absolute;
    bottom: 65px;
    width: 100%;
    display: flex;
    justify-content: space-around;
}

#controls button {
    margin: 0;
    padding: 12px 25px;
    background: #222;
}

</style>
</head>

<body>

<div id="game">

<div id="menu">
<h1>A CIDADE SOMBRIA</h1>
<p>Você está sozinho em uma cidade abandonada...</p>
<p>Encontre os cristais e fuja dos monstros.</p>
<button onclick="startGame()">COMEÇAR</button>
</div>

<div id="hud">
❤️ Vidas: <span id="lives">3</span><br>
💎 Cristais: <span id="score">0</span><br>
🌑 Fase: <span id="level">1</span>
</div>

<div id="player">🧍</div>

<div id="flash"></div>

<div id="gameover">
<h2>FIM DE JOGO</h2>
<p id="finalscore"></p>
<button onclick="startGame()">JOGAR NOVAMENTE</button>
</div>

<div id="message">
Use ← → para andar e ESPAÇO para desviar.
</div>

<div id="controls">
<button onclick="move(-1)">⬅️</button>
<button onclick="move(1)">➡️</button>
</div>

</div>

<script>

let player = document.getElementById("player");
let game = document.getElementById("game");

let lives = 3;
let score = 0;
let level = 1;
let position = 50;
let playing = false;
let monsters = [];
let crystals = [];
let timer;

function startGame() {

    lives = 3;
    score = 0;
    level = 1;
    position = 50;
    playing = true;

    document.getElementById("menu").style.display = "none";
    document.getElementById("gameover").style.display = "none";

    monsters.forEach(m => m.element.remove());
    crystals.forEach(c => c.element.remove());

    monsters = [];
    crystals = [];

    clearInterval(timer);

    updateHUD();
    updatePlayer();

    timer = setInterval(createObjects, 1100);

}

function updatePlayer() {
    player.style.left = position + "%";
}

function move(direction) {

    if (!playing) return;

    position += direction * 7;

    if (position < 5) position = 5;
    if (position > 95) position = 95;

    updatePlayer();
}

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" || e.key === "a") move(-1);
    if (e.key === "ArrowRight" || e.key === "d") move(1);

});

function createObjects() {

    if (!playing) return;

    let isMonster = Math.random() < 0.65;

    let element = document.createElement("div");

    element.className = isMonster ? "monster" : "crystal";

    element.innerHTML = isMonster ? "👹" : "💎";

    let x = Math.random() * 90 + 5;

    element.style.left = x + "%";
    element.style.top = "-50px";

    game.appendChild(element);

    let object = {
        element: element,
        x: x,
        y: -50,
        monster: isMonster
    };

    if (isMonster) {
        monsters.push(object);
    } else {
        crystals.push(object);
    }

}

function updateHUD() {

    document.getElementById("lives").innerText = lives;
    document.getElementById("score").innerText = score;
    document.getElementById("level").innerText = level;

}

setInterval(function() {

    if (!playing) return;

    [...monsters, ...crystals].forEach(object => {

        object.y += 3 + level * 0.5;

        object.element.style.top = object.y + "px";

        let collision =
            object.y > window.innerHeight - 180 &&
            object.y < window.innerHeight - 90 &&
            Math.abs(object.x - position) < 8;

        if (collision) {

            if (object.monster) {

                lives--;

                document.getElementById("flash").style.opacity = 0.3;

                setTimeout(() => {
                    document.getElementById("flash").style.opacity = 0;
                }, 150);

                if (lives <= 0) {
                    endGame();
                }

            } else {

                score += 10;

                if (score % 100 === 0) {
                    level++;
                }

            }

            object.element.remove();

            monsters = monsters.filter(m => m !== object);
            crystals = crystals.filter(c => c !== object);

            updateHUD();

        }

        if (object.y > window.innerHeight) {

            object.element.remove();

            monsters = monsters.filter(m => m !== object);
            crystals = crystals.filter(c => c !== object);

        }

    });

}, 30);

function endGame() {

    playing = false;

    clearInterval(timer);

    document.getElementById("gameover").style.display = "flex";

    document.getElementById("finalscore").innerText =
        "Você conseguiu " + score + " pontos!";

}

</script>

</body>
</html>
